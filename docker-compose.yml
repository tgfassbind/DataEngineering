name: deng-datapipeline

services:
  object-storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?copy .env.example to .env}
      S3_BUCKET: ${S3_BUCKET:-sbb-ist-daten}
    ports:
      - "127.0.0.1:${S3_API_PORT:-8333}:8333"   # S3 API, localhost only
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [deng-datapipeline]

  fetcher:
    build: ./fetcher
    image: deng-datapipeline/fetcher:1.0.0
    profiles: ["jobs"]
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      # no ":" -> an explicitly EMPTY value is kept (= real AWS S3)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://object-storage:8333}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?copy .env.example to .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?copy .env.example to .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sbb-ist-daten}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-false}
      S3_BUCKET_WAIT_SECONDS: ${S3_BUCKET_WAIT_SECONDS:-60}
      PERMALINK_URL_TEMPLATE: ${PERMALINK_URL_TEMPLATE:-}
      ARCHIVE_URL_TEMPLATE: ${ARCHIVE_URL_TEMPLATE:-}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-120}
      FETCHER_TIMEZONE: ${FETCHER_TIMEZONE:-Europe/Zurich}
      FETCHER_REFERENCE_DATE: ${FETCHER_REFERENCE_DATE:-}
    volumes:
      - /tmp/fetcher   # anonymous volume: archive ZIP scratch space, removed by --rm
    networks: [deng-datapipeline]

  transform:
    build: ./transform
    image: deng-datapipeline/transform:1.0.0
    profiles: ["jobs"]
    depends_on:
      object-storage:
        condition: service_healthy
      database:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://object-storage:8333}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?copy .env.example to .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?copy .env.example to .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sbb-ist-daten}
      S3_BUCKET_WAIT_SECONDS: ${S3_BUCKET_WAIT_SECONDS:-60}
      POSTGRES_HOST: ${POSTGRES_HOST:-database}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-deng}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      TRANSFORM_LINES_FILE: ${TRANSFORM_LINES_FILE:-}
      TRANSFORM_CHUNK_SIZE: ${TRANSFORM_CHUNK_SIZE:-100000}
      TRANSFORM_MAX_ABS_DELAY_S: ${TRANSFORM_MAX_ABS_DELAY_S:-10800}
      TRANSFORM_MAX_SEGMENT_DURATION_S: ${TRANSFORM_MAX_SEGMENT_DURATION_S:-21600}
    volumes:
      - ./transform/config:/opt/transform/config:ro   # versioned line selection
      - ./dataset:/opt/transform/dataset:ro           # fixture for app.seed
    # hard memory limit: the job streams in chunks and must fit (peak ~360 MiB
    # for a 3-million-row day at the default chunk size)
    mem_limit: ${TRANSFORM_MEM_LIMIT:-1g}
    networks: [deng-datapipeline]

  database:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-deng}
    ports:
      # published for external queries (psql, BI tools); 127.0.0.1 = this machine only
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # schemas + staging table; runs only when db-data is empty
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: TCP only answers once the init scripts are done
      # (during init the server listens on the unix socket only)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [deng-datapipeline]

  # Kestra metadata only
  kestra-db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ${KESTRA_DB_USER:-kestra}
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?append the Kestra block of .env.example to .env}
      POSTGRES_DB: ${KESTRA_DB_NAME:-kestra}
    volumes:
      - kestra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [kestra-internal]

  kestra:
    image: kestra/kestra:v2.0.4
    user: "root"
    depends_on:
      kestra-db:
        condition: service_healthy
      database:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        export SECRET_POSTGRES_PASSWORD="$$(printf '%s' "$$DENG_POSTGRES_PASSWORD" | base64 | tr -d '\n')"
        unset DENG_POSTGRES_PASSWORD
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - kestra-entrypoint
    command:
      - server
      - standalone
      - --config
      - /etc/kestra/application.yml
      - --flow-path
      - /app/deng/flows
    environment:
      # server configuration (placeholders in orchestrator/kestra/application.yml)
      DENG_KESTRA_DB_NAME: ${KESTRA_DB_NAME:-kestra}
      DENG_KESTRA_DB_USER: ${KESTRA_DB_USER:-kestra}
      DENG_KESTRA_DB_PASSWORD: ${KESTRA_DB_PASSWORD:?append the Kestra block of .env.example to .env}
      DENG_KESTRA_BASIC_AUTH_USERNAME: ${KESTRA_BASIC_AUTH_USERNAME:?append the Kestra block of .env.example to .env}
      DENG_KESTRA_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD:?append the Kestra block of .env.example to .env}
      KESTRA_URL: http://localhost:${KESTRA_UI_PORT:-8080}/
      ENV_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-deng-datapipeline}
      ENV_HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env (absolute path of this repo on the host)}
      ENV_FETCHER_TIMEZONE: ${FETCHER_TIMEZONE:-Europe/Zurich}
      # aggregation
      DENG_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      ENV_POSTGRES_HOST: ${POSTGRES_HOST:-database}
      ENV_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ENV_POSTGRES_DB: ${POSTGRES_DB:-deng}
      ENV_POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
    volumes:
      - kestra-data:/app/storage
      - ./orchestrator/kestra/application.yml:/etc/kestra/application.yml:ro
      - ./orchestrator/flows:/app/deng/flows:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    ports:
      - "127.0.0.1:${KESTRA_UI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 6m
    networks: [deng-datapipeline, kestra-internal]

  pgadmin:
    # optional web UI to look at the data: docker compose --profile tools up -d pgadmin
    image: dpage/pgadmin4:9.18.0
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?copy .env.example to .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?copy .env.example to .env}
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PGADMIN_DISABLE_POSTFIX: "true"     # no mail server needed
      POSTGRES_DB: ${POSTGRES_DB:-deng}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"Servers":{"1":{"Name":"SBB Ist-Daten","Group":"DENG","Host":"database","Port":5432,"MaintenanceDB":"%s","Username":"%s","SSLMode":"prefer"}}}' "$$POSTGRES_DB" "$$POSTGRES_USER" > /tmp/servers.json
        exec /entrypoint.sh
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin   # pgAdmin settings, saved passwords, query history
    networks: [deng-datapipeline]

networks:
  deng-datapipeline:
  kestra-internal:

volumes:
  storage-data:
  db-data:
  pgadmin-data:
  kestra-db-data:
  kestra-data: